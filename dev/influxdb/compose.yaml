services:
  influxdb:
    image: influxdb:2.7
    container_name: helmlog-influx-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:18086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: devadmin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: rattler-dev
      DOCKER_INFLUXDB_INIT_BUCKET: RattlerBucket
      DOCKER_INFLUXDB_INIT_RETENTION: 0
    volumes:
      - helmlog_influx_data:/var/lib/influxdb2
      - helmlog_influx_config:/etc/influxdb2

volumes:
  helmlog_influx_data:
  helmlog_influx_config:
